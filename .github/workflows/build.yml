name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Check the web page scripts parse
        run: for f in web/js/*.js; do node --check "$f"; done

      - name: Build the addon
        working-directory: addon
        run: gradle build --no-daemon --stacktrace

      - name: Check the jar contents
        run: |
          JAR=$(ls addon/build/libs/flyui-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -q 'web/index.html'
          unzip -l "$JAR" | grep -q 'fabric.mod.json'
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: flyui
          path: ${{ env.JAR }}

      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR }}
          generate_release_notes: true
